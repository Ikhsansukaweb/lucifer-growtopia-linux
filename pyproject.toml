[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucifer-linux"
version = "1.0.0"
description = "Lucifer Linux — bot Growtopia dengan API Lua Lucifer V1.8"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["growtopia", "gtps", "lua", "bot", "enet", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "lupa>=2.0",
  "requests>=2.31",
  "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lucifer = "lucifer.cli:main"

[project.urls]
Documentation = "https://github.com/Ikhsansukaweb/lucifer-linux"

[tool.setuptools]
packages = ["lucifer"]
include-package-data = true

[tool.setuptools.package-data]
lucifer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
